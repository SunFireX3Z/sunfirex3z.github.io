# public/admin/config.yml

backend:
  name: github
  repo: username-github-anda/nama-repositori-anda # GANTI DENGAN REPO ANDA
  branch: main # Atau branch utama Anda (mis. master)

media_folder: "src/assets/images/uploads" # Folder untuk menyimpan gambar yang di-upload
public_folder: "/assets/images/uploads"

collections:
  - name: "posts_id"
    label: "Artikel (Bahasa Indonesia)"
    folder: "src/content/id"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{category}}/{{slug}}/index"
    media_folder: "" # Gunakan media_folder global
    public_folder: ""
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["Published", "Draft"], default: "Draft" }
      - { label: "Penulis", name: "author", widget: "select", options: ["Randy", "Luna", "Inda Nesya", "Airu"] } # Sesuaikan dengan daftar penulis Anda
      - { label: "Tanggal Publikasi", name: "publishDate", widget: "datetime", format: "D MMMM YYYY", dateFormat: "DD MMMM YYYY", timeFormat: false }
      - { label: "Kategori", name: "category", widget: "string" }
      - { label: "Sub-Kategori (Opsional)", name: "subcategory", widget: "string", required: false }
      - { label: "Tipe Konten", name: "contentType", widget: "select", options: ["Penjelasan", "Tutorial", "Sejarah", "Opini"], default: "Penjelasan" }
      - { label: "Deskripsi Singkat (untuk kartu artikel)", name: "description", widget: "text" }
      - { label: "Deskripsi Meta (untuk SEO)", name: "metaDescription", widget: "text" }
      - { label: "Thumbnail Artikel", name: "thumbnail", widget: "image" }
      - { label: "Keterangan Gambar Thumbnail (Opsional)", name: "imageCaption", widget: "string", required: false }
      - { label: "Perkiraan Waktu Baca (menit)", name: "readingTime", widget: "number", value_type: "int" }
      - { label: "Tingkat Kesulitan", name: "difficulty", widget: "select", options: ["Pemula", "Menengah", "Ahli"], default: "Pemula" }
      - { label: "Tandai sebagai Artikel Unggulan (Featured)", name: "featured", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", allow_add: true }
      - { label: "Sumber Referensi", name: "sources", widget: "list", fields: [
            { label: "Nama Sumber", name: "name", widget: "string" },
            { label: "URL", name: "url", widget: "string" }
          ]}
      - { label: "Isi Artikel (MDX)", name: "body", widget: "markdown" }
    editor:
      preview: false # Matikan preview internal agar tidak bentrok dengan komponen Astro
